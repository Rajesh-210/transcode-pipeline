services:
  redis:
    image: redis:7-alpine
    container_name: transcode-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - transcode-prod-net

  api:
    image: ${DOCKERHUB_USER:-chilukurir}/transcode-api:${IMAGE_TAG:-latest}
    container_name: transcode-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - STORAGE_BACKEND=local
      - LOCAL_STORAGE_PATH=/app/local-storage
      - REDIS_URL=redis://redis:6379/0
      - API_TITLE=Transcoding Pipeline API
      - LOG_LEVEL=info
      - CORS_ORIGINS=*
    volumes:
      - local_storage:/app/local-storage
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - transcode-prod-net

  worker:
    image: ${DOCKERHUB_USER:-chilukurir}/transcode-worker:${IMAGE_TAG:-latest}
    container_name: transcode-worker
    restart: unless-stopped
    environment:
      - STORAGE_BACKEND=local
      - LOCAL_STORAGE_PATH=/app/local-storage
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=info
    volumes:
      - local_storage:/app/local-storage
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - transcode-prod-net

volumes:
  redis_prod_data:
  local_storage:

networks:
  transcode-prod-net:
    driver: bridge
