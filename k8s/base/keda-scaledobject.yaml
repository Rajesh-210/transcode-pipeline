apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: transcode-worker-keda
  namespace: transcode-pipeline
spec:
  scaleTargetRef:
    name: transcode-worker
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 0
  maxReplicaCount: 10
  triggers:
    - type: redis-list
      metadata:
        address: redis-master:6379
        listName: transcode:queue
        listLength: "5"
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-k8s.monitoring.svc:9090
        metricName: transcode_jobs_processed_total
        query: sum(rate(transcode_jobs_processed_total[5m]))
        threshold: "50"