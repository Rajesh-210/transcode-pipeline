apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: transcode-worker-keda
  namespace: transcode-pipeline
spec:
  scaleTargetRef:
    name: transcode-worker
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 0
  maxReplicaCount: 10
  triggers:
    - type: redis-list
      metadata:
        address: redis-service.transcode-pipeline.svc.cluster.local:6379
        listName: transcode:queue
        listLength: "5"
