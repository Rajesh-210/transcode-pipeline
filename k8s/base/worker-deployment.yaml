apiVersion: apps/v1
kind: Deployment
metadata:
  name: transcode-worker
  namespace: transcode-pipeline
  labels:
    app.kubernetes.io/name: transcode-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: transcode-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: transcode-worker
    spec:
      containers:
        - name: worker
          image: your-registry/transcode-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: transcode-config
            - secretRef:
                name: transcode-secrets
          env:
            - name: MINIO_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: transcode-secrets
                  key: MINIO_ENDPOINT
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: transcode-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: transcode-secrets
                  key: MINIO_SECRET_KEY
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"