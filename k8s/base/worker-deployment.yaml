apiVersion: apps/v1
kind: Deployment
metadata:
  name: transcode-worker
  namespace: transcode-pipeline
  labels:
    app.kubernetes.io/name: transcode-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: transcode-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: transcode-worker
    spec:
      containers:
        - name: worker
          image: chilukurir/transcode-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: transcode-config
            - secretRef:
                name: transcode-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: local-storage
              mountPath: /app/local-storage
      volumes:
        - name: local-storage
          emptyDir: {}
