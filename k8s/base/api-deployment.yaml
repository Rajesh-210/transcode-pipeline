apiVersion: apps/v1
kind: Deployment
metadata:
  name: transcode-api
  namespace: transcode-pipeline
  labels:
    app.kubernetes.io/name: transcode-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: transcode-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: transcode-api
    spec:
      containers:
        - name: api
          image: chilukurir/transcode-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: transcode-config
            - secretRef:
                name: transcode-secrets
          env:
            - name: MINIO_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: transcode-secrets
                  key: MINIO_ENDPOINT
                  optional: true
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: transcode-secrets
                  key: MINIO_ACCESS_KEY
                  optional: true
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: transcode-secrets
                  key: MINIO_SECRET_KEY
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: local-storage
              mountPath: /app/local-storage
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: local-storage
          emptyDir: {}
