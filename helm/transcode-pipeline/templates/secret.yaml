apiVersion: v1
kind: Secret
metadata:
  name: {{ include "transcode-pipeline.fullname" . }}-secrets
  labels:
    {{- include "transcode-pipeline.labels" . | nindent 4 }}
type: Opaque
stringData:
  # AWS / S3 credentials (used when STORAGE_BACKEND=s3)
  AWS_ACCESS_KEY_ID: {{ .Values.storage.awsAccessKeyID | default "CHANGE_ME" | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.storage.awsSecretAccessKey | default "CHANGE_ME" | quote }}
  AWS_DEFAULT_REGION: {{ .Values.storage.awsDefaultRegion | default "ap-south-1" | quote }}
  S3_BUCKET: {{ .Values.storage.s3Bucket | default "transcode-media-prod" | quote }}
  # MinIO credentials (used when STORAGE_BACKEND=minio)
  MINIO_ENDPOINT: {{ .Values.storage.minioEndpoint | default "minio:9000" | quote }}
  MINIO_ACCESS_KEY: {{ .Values.storage.minioAccessKey | default "minioadmin" | quote }}
  MINIO_SECRET_KEY: {{ .Values.storage.minioSecretKey | default "minioadmin123" | quote }}
