# Default values for transcode-pipeline

replicaCount:
  api: 2
  worker: 1

image:
  api:
    repository: chilukurir/transcode-api
    pullPolicy: Always
    tag: latest
  worker:
    repository: chilukurir/transcode-worker
    pullPolicy: Always
    tag: latest

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300s"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300s"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
          port: 8000
  tls: []

redis:
  enabled: true
  image: redis:7-alpine
  replicas: 1
  persistence:
    enabled: false

keda:
  enabled: true
  minReplicaCount: 0
  maxReplicaCount: 10
  pollingInterval: 15
  cooldownPeriod: 300
  queueLengthThreshold: "5"

resources:
  api:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "256Mi"
  worker:
    limits:
      cpu: "2"
      memory: "2Gi"
    requests:
      cpu: "500m"
      memory: "512Mi"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

storage:
  backend: local  # local, s3, gcs
  s3Bucket: ""
  awsAccessKeyID: "CHANGE_ME"
  awsSecretAccessKey: "CHANGE_ME"
  awsDefaultRegion: "ap-south-1"
  minioEndpoint: "minio:9000"
  minioAccessKey: "minioadmin"
  minioSecretKey: "minioadmin123"
